          type: string
          description: ACTIVE/DISABLED
      additionalProperties: false
    RespData_patch_admin_api_tenants_tenant_id_users_tenant_user_id:
      type: object
      properties:
        tenant_user_id:
          type: integer
          format: int64
      required:
      - tenant_user_id
      additionalProperties: false
    RespEnvelope_patch_admin_api_tenants_tenant_id_users_tenant_user_id:
      allOf:
      - $ref: '#/components/schemas/ApiEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/RespData_patch_admin_api_tenants_tenant_id_users_tenant_user_id'
    RespData_get_admin_api_users:
      type: object
