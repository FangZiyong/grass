    ResourceScope:
      type: string
      enum:
      - TABLE
      - FLOW
      - DATASET
      - DASHBOARD
      description: 资源域（scope）
    ResourceTreeNodeType:
      type: string
      enum:
      - FOLDER
      - RESOURCE
      description: 资源树节点类型
    PermissionLevel:
      type: string
      enum:
      - NONE
      - VIEW
      - EDIT
      - RUN
      - MANAGE
      description: 资源授权级别
    RoleStatus:
      type: string
      enum:
      - ACTIVE
      - DISABLED
      description: 状态
    ColumnAccessLevel:
      type: string
      enum:
      - HIDDEN
      - READONLY
      - WRITE
      description: 列权限访问级别
    TableResourceType:
      type: string
      enum:
      - TABLE_SCHEMA
      - TABLE_DATA
      description: 当 scope=TABLE 时的资源类型
    ResourceTreeNodeDTO:
      type: object
      properties:
        node_id:
          type: integer
          format: int64
        scope:
          $ref: '#/components/schemas/ResourceScope'
        node_type:
          $ref: '#/components/schemas/ResourceTreeNodeType'
        name:
          type: string
        parent_node_id:
          type: integer
          format: int64
          nullable: true
        ref_type:
          $ref: '#/components/schemas/ResourceScope'
          nullable: true
          description: 仅当 node_type=RESOURCE 时存在
        ref_resource_id:
          type: integer
          format: int64
          nullable: true
          description: 仅当 node_type=RESOURCE 时存在
        sort_order:
          type: integer
          format: int32
        path:
          type: string
        depth:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - node_id
      - scope
      - node_type
      - name
      - sort_order
      - path
      - depth
      - created_at
      - updated_at
      additionalProperties: false
    RoleDTO:
      type: object
      properties:
        role_id:
          type: integer
          format: int64
        tenant_id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/RoleStatus'
        is_builtin:
          type: boolean
