p__admin__api__users:
  get:
    tags:
    - AdminUsers
    summary: GlobalUser 列表
    operationId: get_admin_api_users
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/RequestIdHeader
    - name: q
      in: query
      required: false
      schema:
        type: string
        description: 按 login_name/display_name/email 模糊查询; 约束：≤128
    - name: status
      in: query
      required: false
      schema:
        type: string
        description: 状态筛选; 约束：ACTIVE/DISABLED
    - name: is_platform_admin
      in: query
      required: false
      schema:
        type: boolean
        description: 管理员筛选; 约束：true/false
    - name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        description: 分页; 约束：≥1
    - name: page_size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        description: 分页; 约束：1–200
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/RespEnvelope_get_admin_api_users
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
  post:
    tags:
    - AdminUsers
    summary: 创建平台用户（GlobalUser）。
    operationId: post_admin_api_users
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/RequestIdHeader
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/RespEnvelope_post_admin_api_users
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Req_post_admin_api_users
