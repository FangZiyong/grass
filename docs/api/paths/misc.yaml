p__api__audit-logs:
  get:
    tags:
    - Misc
    summary: 审计日志列表查询（只读）。
    operationId: get_api_audit_logs
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/TenantIdHeader
    - $ref: ../openapi.yaml#/components/parameters/RequestIdHeader
    - name: start_time
      in: query
      required: true
      schema:
        type: string
        description: 开始时间（ISO8601 或 yyyy-MM-dd HH:mm:ss）
      description: 开始时间（ISO8601 或 yyyy-MM-dd HH:mm:ss）
    - name: end_time
      in: query
      required: true
      schema:
        type: string
        description: 结束时间
      description: 结束时间
    - name: module
      in: query
      required: false
      schema:
        type: string
        description: AuditModule
      description: AuditModule
    - name: action
      in: query
      required: false
      schema:
        type: string
        description: ActionType
      description: ActionType
    - name: target_type
      in: query
      required: false
      schema:
        type: string
        description: TargetType
      description: TargetType
    - name: target_id
      in: query
      required: false
      schema:
        type: integer
        format: int64
        description: 对象 ID
      description: 对象 ID
    - name: actor_tenant_user_id
      in: query
      required: false
      schema:
        type: integer
        format: int64
        description: 操作人
      description: 操作人
    - name: result
      in: query
      required: false
      schema:
        type: string
        description: SUCCESS/FAILED
      description: SUCCESS/FAILED
    - name: keyword
      in: query
      required: false
      schema:
        type: string
        description: 搜索 summary/target_code（≤100）
      description: 搜索 summary/target_code（≤100）
    - name: request_id
      in: query
      required: false
      schema:
        type: string
        description: 精确匹配（≤64）
      description: 精确匹配（≤64）
    - name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        description: 默认 1
      description: 默认 1
    - name: page_size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        description: 默认 20，最大 200
      description: 默认 20，最大 200
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/RespEnvelope_get_api_audit_logs
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
