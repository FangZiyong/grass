p__api__auth__login:
  post:
    tags:
    - Auth
    summary: 用户登录
    operationId: post_api_auth_login
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/RequestIdHeader
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/RespEnvelope_post_api_auth_login
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Req_post_api_auth_login
    security: []
p__api__auth__logout:
  post:
    tags:
    - Auth
    summary: 退出登录：清除刷新令牌 Cookie，并使当前会话失效。
    operationId: post_api_auth_logout
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/RequestIdHeader
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/RespEnvelope_post_api_auth_logout
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
p__api__auth__refresh:
  post:
    tags:
    - Auth
    summary: 使用 refresh_token（httpOnly Cookie）换取新的 access_token。
    operationId: post_api_auth_refresh
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/RequestIdHeader
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/RespEnvelope_post_api_auth_refresh
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
    security: []
