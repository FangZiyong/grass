    - name: scope
      in: path
      required: true
      schema:
        $ref: '../openapi.yaml#/components/schemas/ResourceScope'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/RespEnvelope_get_api_resource_trees_scope_children
      '400':
