p__api__me:
  get:
    tags:
    - Accounts
    summary: 获取当前登录用户信息
    operationId: get_api_me
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/RequestIdHeader
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/RespEnvelope_get_api_me
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
p__api__tenants:
  get:
    tags:
    - Accounts
    summary: 获取当前用户可访问的租户列表（用于切换/下拉/搜索）。
    operationId: get_api_tenants
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/RequestIdHeader
    - name: q
      in: query
      required: false
      schema:
        type: string
        description: 模糊匹配租户编码/名称
    - name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 1
    - name: page_size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 50
        description: 1–200
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/RespEnvelope_get_api_tenants
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
p__api__tenants__switch:
  post:
    tags:
    - Accounts
    summary: 切换当前租户
    operationId: post_api_tenants_switch
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/RequestIdHeader
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/RespEnvelope_post_api_tenants_switch
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Req_post_api_tenants_switch
