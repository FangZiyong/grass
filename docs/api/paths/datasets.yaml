p__api__datasets:
  get:
    tags:
    - Datasets
    summary: GET /api/datasets
    operationId: get_api_datasets
    parameters:
    - $ref: ../components/parameters.yaml#/XTenantId
    - $ref: ../components/parameters.yaml#/Page
    - $ref: ../components/parameters.yaml#/PageSize
    - $ref: ../components/parameters.yaml#/Keyword
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Envelope_get_api_datasets
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '500':
        $ref: ../components/responses.yaml#/InternalError
  post:
    tags:
    - Datasets
    summary: POST /api/datasets
    operationId: post_api_datasets
    parameters:
    - $ref: ../components/parameters.yaml#/XTenantId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/Req_post_api_datasets
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Envelope_post_api_datasets
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '500':
        $ref: ../components/responses.yaml#/InternalError
