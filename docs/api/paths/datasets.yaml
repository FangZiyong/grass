    - Datasets
    summary: PATCH /api/datasets/{dataset_id}
    operationId: patch_api_datasets_dataset_id
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/TenantIdHeader
    - $ref: ../openapi.yaml#/components/parameters/RequestIdHeader
    - name: dataset_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/RespEnvelope_patch_api_datasets_dataset_id
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Req_patch_api_datasets_dataset_id'
