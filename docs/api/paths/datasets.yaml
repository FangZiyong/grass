p__api__datasets__dataset_id:
  get:
    tags:
    - Datasets
    summary: 获取数据集详情
    operationId: get_api_datasets_dataset_id
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/TenantIdHeader
    - $ref: ../openapi.yaml#/components/parameters/RequestIdHeader
    - name: dataset_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/RespEnvelope_get_api_datasets_dataset_id
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
  patch:
    tags:
    - Datasets
    summary: 更新数据集配置
    operationId: patch_api_datasets_dataset_id
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/TenantIdHeader
    - $ref: ../openapi.yaml#/components/parameters/RequestIdHeader
    - name: dataset_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/RespEnvelope_patch_api_datasets_dataset_id
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/Req_patch_api_datasets_dataset_id'
