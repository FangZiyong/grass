p__admin__api__tenants:
  get:
    tags:
    - AdminTenants
    summary: 平台侧：租户列表（Tenant）。
    operationId: get_admin_api_tenants
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/RequestIdHeader
    - name: q
      in: query
      required: false
      schema:
        type: string
        description: 模糊匹配 code/name
    - name: status
      in: query
      required: false
      schema:
        type: string
        description: ACTIVE/SUSPENDED
    - name: package
      in: query
      required: false
      schema:
        type: string
        description: BASIC/PRO/ENTERPRISE
    - $ref: ../openapi.yaml#/components/parameters/PageParam
    - $ref: ../openapi.yaml#/components/parameters/PageSizeParam
    - $ref: ../openapi.yaml#/components/parameters/SortByParam
    - $ref: ../openapi.yaml#/components/parameters/SortOrderParam
