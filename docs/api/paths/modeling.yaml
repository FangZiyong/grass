p__api__modeling__tables:
  get:
    tags:
    - Modeling
    summary: 在选中 Folder（或根）时加载表列表，并支持搜索/筛选。
    operationId: get_api_modeling_tables
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/TenantIdHeader
    - $ref: ../openapi.yaml#/components/parameters/RequestIdHeader
    - name: folder_node_id
      in: query
      required: false
      schema:
        type: integer
        format: int64
        description: 当前选中目录; 约束：必须是 scope=TABLE 的 Folder
    - name: include_descendants
      in: query
      required: false
      schema:
        type: boolean
        description: 是否递归包含子目录表
        default: false
    - name: keyword
      in: query
      required: false
      schema:
        type: string
        description: 模糊搜索 display_name/code; 约束：长度 ≤50
    - name: table_type
      in: query
      required: false
      schema:
        type: string
        description: 类型筛选; 约束：TableType
    - name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        description: 分页页码; 约束：>=1
        default: 1
    - name: page_size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        description: 分页大小; 约束：1–200
        default: 20
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/RespEnvelope_get_api_modeling_tables
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
  post:
    tags:
    - Modeling
    summary: 新建业务表（元数据 + 资源树节点 + 物理建表）。
    operationId: post_api_modeling_tables
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/TenantIdHeader
    - $ref: ../openapi.yaml#/components/parameters/RequestIdHeader
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/RespEnvelope_post_api_modeling_tables
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Req_post_api_modeling_tables
p__api__modeling__tables__ref_table_id__reference-candidates:
  get:
    tags:
    - Modeling
    summary: 为 REFERENCE 字段提供候选（SELECT/SEARCH）。
    operationId: get_api_modeling_tables_ref_table_id_reference_candidates
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/TenantIdHeader
    - $ref: ../openapi.yaml#/components/parameters/RequestIdHeader
    - name: display_field_id
      in: query
      required: true
      schema:
        type: integer
        format: int64
        description: 用于展示的字段
    - name: q
      in: query
      required: false
      schema:
        type: string
        description: SEARCH 模式关键词
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        description: 1–50
        default: 20
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int32
        description: '>=0'
        default: 0
    - name: ref_table_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/RespEnvelope_get_api_modeling_tables_ref_table_id_reference_candidates
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
