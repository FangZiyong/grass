p__api__flows:
  get:
    tags:
    - Flows
    summary: GET /api/flows
    operationId: get_api_flows
    parameters:
    - $ref: ../components/parameters.yaml#/XTenantId
    - $ref: ../components/parameters.yaml#/Page
    - $ref: ../components/parameters.yaml#/PageSize
    - $ref: ../components/parameters.yaml#/Keyword
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Envelope_get_api_flows
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '500':
        $ref: ../components/responses.yaml#/InternalError
  post:
    tags:
    - Flows
    summary: POST /api/flows
    operationId: post_api_flows
    parameters:
    - $ref: ../components/parameters.yaml#/XTenantId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/Req_post_api_flows
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
