p__api__flows__flow_id__logs:
  get:
    tags:
    - Flows
    summary: 查询 Flow 维度的运行日志（可按 run_id 过滤）。
    operationId: get_api_flows_flow_id_logs
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/TenantIdHeader
    - $ref: ../openapi.yaml#/components/parameters/RequestIdHeader
    - name: flow_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    - name: run_id
      in: query
      required: false
      schema:
        type: integer
        format: int64
        description: 可选：指定 FlowRun
    - name: since_id
      in: query
      required: false
      schema:
        type: integer
        format: int64
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 500
        description: 1–2000
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/RespEnvelope_get_api_flows_flow_id_logs
      '400':
