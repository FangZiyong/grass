components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '在 `Authorization: Bearer <token>` 中传递访问令牌。'
  schemas:
    ApiEnvelope:
      type: object
      properties:
        code:
          oneOf:
            - type: string
              enum:
                - OK
                - UNAUTHENTICATED
                - PERMISSION_DENIED
                - NOT_FOUND
                - BAD_REQUEST
                - CONFLICT
                - PRECONDITION_FAILED
                - RATE_LIMITED
                - INTERNAL_ERROR
            - type: string
              pattern: ^[A-Z][A-Z0-9_]*$
              description: 模块化错误码（模块前缀+语义），如 TENANT_NOT_FOUND
          description: 业务码（字符串）。成功固定为 `OK`；失败为通用错误码或模块化错误码。
        message:
          type: string
          description: 提示信息；成功可为 `OK` 或空字符串；失败必须可读。
        data:
          nullable: true
          description: 成功时为业务数据；失败时通常为 null；如需结构化错误详情可返回对象。
        request_id:
          type: string
          description: 链路追踪请求 ID；若客户端传入 Header `X-Request-Id`，服务端回显。
      required:
        - code
        - message
        - data
        - request_id
      additionalProperties: false
      example:
        code: OK
        message: OK
        data:
          example: true
        request_id: req_01HRQ0Z9W3W0Y4K7...
    ApiErrorData:
      type: object
      properties:
        error_code:
          type: string
          description: 错误码（建议与顶层 code 一致）
          pattern: ^[A-Z][A-Z0-9_]*$
        details:
          type: object
          additionalProperties: true
      required:
        - error_code
      additionalProperties: false
      example:
        error_code: BAD_REQUEST
        details:
          field: page_size
          reason: must be <= 200
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/ApiErrorData'
              description: 失败时通常为 null；如需结构化错误详情可返回 ApiErrorData。
      example:
        code: PERMISSION_DENIED
        message: You do not have permission to perform this action.
        data: null
        request_id: req_01HRQ0Z9W3W0Y4K7...
    RespData_get_admin_api_tenants:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantSummary'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
          minimum: 0
      required:
        - items
        - page
        - page_size
        - total
      additionalProperties: false
    RespEnvelope_get_admin_api_tenants:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RespData_get_admin_api_tenants'
    Req_post_admin_api_tenants:
      type: object
      properties:
        code:
          type: string
          description: 租户编码; 枚举/约束：全局唯一；1–64
        name:
          type: string
          description: 租户名称; 枚举/约束：1–128
        plan:
          type: string
          description: 套餐; 枚举/约束：BASIC/PRO/ENTERPRISE
        status:
          type: string
          description: 默认 ACTIVE; 枚举/约束：ACTIVE/SUSPENDED
        initial_owner_user_ids:
          type: array
          items:
            type: number
          description: 用于满足“每租户至少一个 Owner”的约束; 枚举/约束：至少 1 个
      additionalProperties: false
      required:
        - code
        - name
        - plan
        - initial_owner_user_ids
    RespData_post_admin_api_tenants:
      type: object
      properties:
        tenant_id:
          type: number
          description: 新租户 ID
      additionalProperties: false
    RespEnvelope_post_admin_api_tenants:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RespData_post_admin_api_tenants'
    Req_patch_admin_api_tenants_tenant_id:
      type: object
      properties:
        name:
          type: string
          description: 租户名称（**补齐必做**）; 枚举/约束：1–128
        plan:
          type: string
          description: 套餐; 枚举/约束：BASIC/PRO/ENTERPRISE
        status:
          type: string
          description: 状态; 枚举/约束：ACTIVE/SUSPENDED
      additionalProperties: false
    RespData_patch_admin_api_tenants_tenant_id:
      type: object
      additionalProperties: true
    RespEnvelope_patch_admin_api_tenants_tenant_id:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RespData_patch_admin_api_tenants_tenant_id'
