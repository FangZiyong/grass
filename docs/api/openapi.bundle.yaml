          type: integer
          format: int64
        resource_type:
          type: string
          description: TABLE_SCHEMA/TABLE_DATA/FLOW/DATASET/DASHBOARD
        permission_level:
          $ref: '#/components/schemas/PermissionLevel'
        is_inherited:
          type: boolean
      required:
