    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
      description: 可选：调用方自定义请求 ID，用于端到端追踪。
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
        description: 分页页码（从 1 开始）
