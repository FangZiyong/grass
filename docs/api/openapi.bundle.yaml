    ResourceScope:
      type: string
      enum:
        - TABLE
        - FLOW
        - DATASET
        - DASHBOARD
      description: 资源域（scope）
    ResourceTreeNodeType:
      type: string
      enum:
        - FOLDER
        - RESOURCE
      description: 资源树节点类型
    PermissionLevel:
      type: string
      enum:
        - NONE
        - VIEW
        - EDIT
        - RUN
        - MANAGE
      description: 资源授权级别
    RoleStatus:
      type: string
      enum:
        - ACTIVE
        - DISABLED
      description: 状态
    ColumnAccessLevel:
      type: string
      enum:
        - HIDDEN
        - READONLY
        - WRITE
      description: 列权限访问级别
    TableResourceType:
      type: string
      enum:
        - TABLE_SCHEMA
        - TABLE_DATA
      description: 当 scope=TABLE 时的资源类型
    ResourceTreeNodeDTO:
      type: object
      properties:
        node_id:
          type: integer
          format: int64
        scope:
          $ref: '#/components/schemas/ResourceScope'
        node_type:
          $ref: '#/components/schemas/ResourceTreeNodeType'
        name:
          type: string
        parent_id:
          type: integer
          format: int64
          nullable: true
        ref_type:
          $ref: '#/components/schemas/ResourceScope'
          nullable: true
          description: 仅当 node_type=RESOURCE 时存在
        ref_id:
          type: integer
          format: int64
          nullable: true
          description: 仅当 node_type=RESOURCE 时存在
        sort_order:
          type: integer
          format: int32
        path:
          type: string
        depth:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - node_id
        - scope
        - node_type
        - name
        - sort_order
        - path
        - depth
        - created_at
        - updated_at
      additionalProperties: false
    RoleDTO:
      type: object
      properties:
        role_id:
          type: integer
          format: int64
        tenant_id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/RoleStatus'
        is_builtin:
          type: boolean
          description: 系统/内置角色
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - role_id
        - tenant_id
        - code
        - name
        - status
        - is_builtin
        - created_at
        - updated_at
      additionalProperties: false
    RowPermissionDTO:
      type: object
      properties:
        row_permission_id:
          type: integer
          format: int64
        role_id:
          type: integer
          format: int64
        table_id:
          type: integer
          format: int64
        name:
          type: string
        filter_dsl:
          type: object
          description: FilterDSL（见 PRD/tech）
        status:
          $ref: '#/components/schemas/RoleStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - row_permission_id
        - role_id
        - table_id
        - name
        - filter_dsl
        - status
        - created_at
        - updated_at
      additionalProperties: false
    ColumnPermissionItem:
