XTenantId:
  name: X-Tenant-Id
  in: header
  required: true
  schema:
    type: integer
    format: int64
  description: TenantContext header required for tenant-scoped APIs.
Page:
  name: page
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    default: 1
PageSize:
  name: page_size
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 200
    default: 20
Keyword:
  name: keyword
  in: query
  required: false
  schema:
    type: string
    maxLength: 50
