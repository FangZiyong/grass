ApiCode:
  type: string
  description: Business/result code. Align with tech.md error code table.
  example: OK
ApiEnvelopeBase:
  type: object
  additionalProperties: false
  required:
  - success
  - code
  - message
  - data
  - trace_id
  properties:
    success:
      type: boolean
    code:
      $ref: '#/components/schemas/ApiCode'
    message:
      type: string
    data: {}
    trace_id:
      type: string
      description: Request trace id for debugging
ApiEnvelopeError:
  allOf:
  - $ref: '#/components/schemas/ApiEnvelopeBase'
  - type: object
    properties:
      success:
        const: false
      data:
        nullable: true
EmptyObject:
  type: object
  additionalProperties: false
  description: Placeholder object. Replace with real DTO.
PageResultBase:
  type: object
  additionalProperties: false
  required:
  - total
  - items
  properties:
    total:
      type: integer
      format: int64
      minimum: 0
    items:
      type: array
      items: {}
FilterOperator:
  type: string
  description: Filter operator enum placeholder
  example: EQ
FilterCondition:
  type: object
  additionalProperties: false
  required:
  - field
  - operator
  properties:
    field:
      type: string
    operator:
      $ref: '#/components/schemas/FilterOperator'
    value: {}
FilterGroup:
  type: object
  additionalProperties: false
  required:
  - op
  - conditions
  properties:
    op:
      type: string
      enum:
      - AND
      - OR
    conditions:
      type: array
      items:
        $ref: '#/components/schemas/FilterNode'
FilterNode:
  oneOf:
  - $ref: '#/components/schemas/FilterGroup'
  - $ref: '#/components/schemas/FilterCondition'
